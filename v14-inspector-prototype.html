<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JTS-01 V1.4 Inspector</title><style>
html,body{margin:0;width:100%;height:100%;background:#000700;color:#72ff55;font-family:"Courier New",monospace;overflow:hidden}#jts{position:absolute;inset:0;width:100%;height:100%;border:0}#inspector{position:fixed;right:18px;bottom:18px;width:min(440px,calc(100vw - 36px));background:rgba(0,10,0,.97);border:1px solid #1b661b;box-shadow:0 0 28px rgba(114,255,85,.18);z-index:50;display:none}#inspector.open{display:block}header{display:flex;justify-content:space-between;padding:9px 11px;border-bottom:1px solid #1b661b;font-weight:900}button{font:inherit;color:#72ff55;background:#001000;border:1px solid #1b661b;padding:4px 8px}.body{padding:12px}.call{font-size:25px;font-weight:900}.route{font-size:18px;color:#62b8ff;margin:3px 0 11px}.model{font-size:17px;color:#c8ffc0;margin-bottom:10px}.grid{display:grid;grid-template-columns:125px 1fr;gap:5px 10px;font-size:13px}.k{color:#4acb3d}.v{color:#c8ffc0}.airport{margin-top:10px;padding-top:8px;border-top:1px solid #164d16;font-size:12px;line-height:1.45}.photo{display:inline-block;margin-top:11px;color:#62b8ff;text-decoration:none;border:1px solid #164d16;padding:6px 8px}.loading{padding:18px}.hint{position:fixed;left:12px;bottom:10px;z-index:45;background:#001000cc;border:1px solid #1b661b;padding:6px 9px;font-size:10px;pointer-events:none}@media(max-width:600px){#inspector{left:8px;right:8px;bottom:8px;width:auto}}
</style></head><body><iframe id="jts" src="/"></iframe><div class="hint">V1.4 LAB // CLICK AIRCRAFT FOR ENRICHED ID</div><section id="inspector"><header><span>AIRCRAFT INTELLIGENCE</span><button id="close">X</button></header><div id="body" class="body"></div></section><script>
const frame=document.getElementById('jts'),panel=document.getElementById('inspector'),body=document.getElementById('body');const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const V=v=>String(v||'').trim()||'---';
async function show(tr){const a=tr.air||{},call=V(a.flight||a.hex),reg=V(a.r||a.reg||a.registration),hex=V(a.hex);panel.classList.add('open');body.innerHTML=`<div class="call">${esc(call)}</div><div class="loading">QUERYING AIRCRAFT DATABASE...</div>`;let d={};try{const r=await fetch(`/api/aircraft-info?hex=${encodeURIComponent(hex)}&reg=${encodeURIComponent(reg==='---'?'':reg)}&callsign=${encodeURIComponent(call==='---'?'':call)}`);if(r.ok)d=await r.json()}catch(e){}const rt=d.route||{},o=rt.origin||{},z=rt.destination||{};const route=(o.iata||o.icao)&&(z.iata||z.icao)?`${o.iata||o.icao} > ${z.iata||z.icao}`:V(a.route||'ROUTE UNKNOWN');const model=[d.manufacturer,d.type].filter(Boolean).join(' ')||V(a.t);body.innerHTML=`<div class="call">${esc(call)}</div><div class="route">${esc(route)}</div><div class="model">${esc(model)}</div><div class="grid"><div class="k">REGISTRATION</div><div class="v">${esc(V(d.registration||reg))}</div><div class="k">ICAO TYPE</div><div class="v">${esc(V(d.icao_type||a.t))}</div><div class="k">OWNER</div><div class="v">${esc(V(d.registered_owner))}</div><div class="k">OWNER COUNTRY</div><div class="v">${esc(V(d.registered_owner_country_name))}</div><div class="k">AIRLINE</div><div class="v">${esc(V(rt.airline))}</div><div class="k">AIRLINE ICAO</div><div class="v">${esc(V(rt.airline_icao))}</div><div class="k">HEX</div><div class="v">${esc(hex)}</div></div>${o.name?`<div class="airport"><b>FROM</b> ${esc(V(o.iata||o.icao))} · ${esc(o.name)}<br>${esc(V(o.municipality))} · ${esc(V(o.country))}</div>`:''}${z.name?`<div class="airport"><b>TO</b> ${esc(V(z.iata||z.icao))} · ${esc(z.name)}<br>${esc(V(z.municipality))} · ${esc(V(z.country))}</div>`:''}${d.url_photo_search?`<a class="photo" href="${esc(d.url_photo_search)}" target="_blank" rel="noopener">PHOTO SEARCH · ${esc(V(d.registration||reg))} ↗</a>`:''}`}
function install(){let w,doc,c;try{w=frame.contentWindow;doc=w.document;c=doc.getElementById('scope')}catch(e){return}if(!c||c.dataset.v14i)return;c.dataset.v14i='1';c.addEventListener('pointerup',e=>{let mode='';try{mode=w.eval('displayMode')}catch(e){}if(mode!=='radar'&&mode!=='radarwx')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height,cx=c.width/2,cy=c.height/2;let hits=[],map;try{hits=w.eval('classicHit');map=w.eval('tracks')}catch(e){return}let best=null,bd=Infinity;for(const h of hits||[]){const q=(x-(cx+h.px))**2+(y-(cy+h.py))**2;if(q<bd){bd=q;best=h}}if(!best||bd>(34*(w.devicePixelRatio||1))**2)return;const tr=map.get(best.id);if(tr)show(tr)},true)}frame.addEventListener('load',()=>{setTimeout(install,500);setTimeout(install,1800)});setInterval(install,2500);document.getElementById('close').onclick=()=>panel.classList.remove('open');
</script></body></html>
